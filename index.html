<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语学习工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.container{max-width:600px;width:100%}
h1{text-align:center;font-size:28px;margin-bottom:8px;color:#1a1a2e}
.sub{text-align:center;font-size:14px;color:#888;margin-bottom:32px}
.cards{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-decoration:none;color:inherit;transition:all .2s;display:flex;align-items:center;gap:16px}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.card .icon.ielts{background:linear-gradient(135deg,#667eea,#764ba2)}
.card .icon.ipa{background:linear-gradient(135deg,#43a047,#66bb6a)}
.card .info h2{font-size:18px;margin-bottom:4px}
.card .info p{font-size:13px;color:#888;line-height:1.4}
.card .arrow{color:#ccc;font-size:20px;margin-left:auto;flex-shrink:0}
footer{text-align:center;margin-top:40px;font-size:12px;color:#bbb}
</style>
</head>
<body>
<div class="container">
  <h1>📖 英语学习工具</h1>
  <p class="sub">雅思 3500 词 · 国际音标</p>
  <div class="cards">
    <a class="card" href="ielts3500.html">
      <div class="icon ielts">📚</div>
      <div class="info">
        <h2>IELTS 3500 词</h2>
        <p>艾宾浩斯记忆 · 柯林斯例句 · 逐词音标 · 默写模式</p>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="ipa_learning.html">
      <div class="icon ipa">🔊</div>
      <div class="info">
        <h2>国际音标学习</h2>
        <p>16 课系统课程 · 音标分类 · 单词跟读 · 点击发音</p>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <footer>爱学英语 · 学习工具站</footer>
</div>
</body>
</html>
